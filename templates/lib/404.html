<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | BridgeHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #2C3E50 0%, #B5B0A1 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            color: white;
            animation: slideInUp 0.8s ease-out;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            margin-bottom: 1rem;
            opacity: 0.1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
            z-index: 2;
            position: relative;
        }

        .error-title {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            z-index: 2;
            position: relative;
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            z-index: 2;
            position: relative;
        }

        .btn-back {
            background: white;
            color: #2C3E50;
            padding: 1rem 3rem;
            border-radius: 24px;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 2;
            position: relative;
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            color: #2C3E50;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-icon">
            <i class="fas fa-map"></i>
        </div>
        <h1 class="error-title">Lost in the Learning Forest?</h1>
        <p class="error-message">The page you're looking for has wandered off the trail.</p>
        <p class="error-message small" style="opacity: 0.7;">Let's get you back on the learning journey!</p>
        <a href="/lib/library" class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Return to Library
        </a>
    </div>
</body>
</html>
