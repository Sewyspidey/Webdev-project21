<!-- Accessibility CSS for dark mode, high contrast, and font size -->
<style>
    /* ==================== DARK MODE ==================== */
    body.dark-mode {
        background-color: #1a1a1a !important;
        color: #e8e8e8 !important;
    }
    body.dark-mode .navbar-new,
    body.dark-mode nav,
    body.dark-mode .sidebar-left,
    body.dark-mode .sidebar-right {
        background-color: #252525 !important;
        border-color: #3a3a3a !important;
    }
    body.dark-mode .navbar-new-link,
    body.dark-mode a:not(.btn) {
        color: #e8e8e8 !important;
    }
    body.dark-mode .card,
    body.dark-mode .post-card,
    body.dark-mode .modal-content,
    body.dark-mode .dropdown-menu,
    body.dark-mode .navbar-new-dropdown,
    body.dark-mode .chat-sidebar,
    body.dark-mode .message-bubble {
        background-color: #2d2d2d !important;
        border-color: #3a3a3a !important;
        color: #e8e8e8 !important;
    }
    body.dark-mode .form-control,
    body.dark-mode .form-select,
    body.dark-mode input,
    body.dark-mode textarea {
        background-color: #333 !important;
        border-color: #4a4a4a !important;
        color: #e8e8e8 !important;
    }
    body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, 
    body.dark-mode h4, body.dark-mode h5, body.dark-mode h6,
    body.dark-mode p, body.dark-mode label, body.dark-mode span {
        color: #e8e8e8 !important;
    }
    body.dark-mode .text-muted {
        color: #999 !important;
    }
    body.dark-mode footer {
        background-color: #111 !important;
    }
    
    /* ==================== HIGH CONTRAST ==================== */
    body.high-contrast {
        background-color: #000 !important;
        color: #fff !important;
    }
    body.high-contrast nav,
    body.high-contrast .navbar-new,
    body.high-contrast .sidebar-left,
    body.high-contrast .sidebar-right {
        background-color: #000 !important;
        border: 2px solid #ff0 !important;
    }
    body.high-contrast a {
        color: #ff0 !important;
        text-decoration: underline !important;
    }
    body.high-contrast .card,
    body.high-contrast .post-card,
    body.high-contrast .modal-content {
        background-color: #000 !important;
        border: 2px solid #fff !important;
        color: #fff !important;
    }
    body.high-contrast .btn {
        background-color: #ff0 !important;
        color: #000 !important;
        border: 2px solid #fff !important;
        font-weight: bold !important;
    }
    body.high-contrast .form-control,
    body.high-contrast .form-select {
        background-color: #000 !important;
        color: #fff !important;
        border: 2px solid #fff !important;
    }
    
    /* ==================== FONT SIZE ==================== */
    body.font-large {
        font-size: 1.15rem !important;
    }
    body.font-large h1 { font-size: 2.8rem !important; }
    body.font-large h2 { font-size: 2.2rem !important; }
    body.font-large h3 { font-size: 1.8rem !important; }
    
    body.font-extra-large {
        font-size: 1.35rem !important;
    }
    body.font-extra-large h1 { font-size: 3.2rem !important; }
    body.font-extra-large h2 { font-size: 2.6rem !important; }
    body.font-extra-large h3 { font-size: 2.1rem !important; }
</style>
