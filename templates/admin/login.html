<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BridgeHive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FEFAF1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 2.5rem;
            width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .login-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 2rem;
            color: #454545;
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #454545;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #B7B7B7;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            outline: none;
            border-color: #8F7B6A;
        }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background-color: #8F7B6A;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-login:hover {
            background-color: #7A6A5A;
        }
        .flash {
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            background-color: rgba(197,75,75,0.1);
            color: #C54B4B;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #555;
            text-decoration: none;
        }
        .demo {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #EDEDE5;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>BridgeHive Admin</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
        <a href="{{ url_for('landing') }}" class="back-link">← Back to BridgeHive</a>
        <div class="demo"><strong>Demo:</strong> admin / admin123</div>
    </div>
</body>
</html>
