{% extends "base.html" %}
{% block title %}Edit FAQ - BridgeHive{% endblock %}

{% block navbar %}
{% include 'includes/navbar_new.html' %}
{% endblock %}

{% block extra_css %}
<style>
    .admin-header {
        background-color: #8F7B6A;
        color: white;
        padding: 1.5rem 2rem;
    }
    .admin-header h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; }
    .admin-content { padding: 2rem; max-width: 700px; }
    .form-card {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: #454545;
    }
    .form-control, .form-select {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #B7B7B7;
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
    }
    .form-check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .form-check input { width: 18px; height: 18px; }
    .btn-actions { display: flex; gap: 1rem; margin-top: 2rem; }
    .btn-submit {
        background: #8F7B6A;
        color: white;
        padding: 0.75rem 2rem;
        border: none;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
    }
    .btn-cancel {
        background: #EDEDE5;
        color: #454545;
        padding: 0.75rem 2rem;
        border: none;
        border-radius: 8px;
        text-decoration: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-header">
    <h1>Edit FAQ #{{ faq.id }}</h1>
</div>

<div class="admin-content">
    <div class="form-card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Question</label>
                <textarea name="question" class="form-control" rows="3" required>{{ faq.question }}</textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Answer</label>
                <textarea name="answer" class="form-control" rows="5" required>{{ faq.answer }}</textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if faq.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-check">
                    <input type="checkbox" name="is_active" {% if faq.is_active %}checked{% endif %}>
                    <span>Active</span>
                </label>
            </div>
            <div class="btn-actions">
                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{{ url_for('admin_faq_list') }}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
